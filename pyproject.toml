[project]
name = "rocket-workbench"
version = "0.1.0"
description = "Local parametric model rocket design and OpenRocket simulation workbench"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pydantic",
  "pyyaml",
  "numpy",
  "jpype1",
  "orhelper @ https://github.com/openrocket/orhelper/archive/fb132c49e661bb00c5586cce6a4ac0c655425197.tar.gz",
]

[project.optional-dependencies]
cad = [
    "cadquery",
]
analysis = [
    "rocketpy>=1.13.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest",
]
docs = [
    "zensical>=0.0.61",
]

[project.scripts]
rocket-workbench = "rocket_workbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real OpenRocket and CAD integration"]
